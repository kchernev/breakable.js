# Builds the demo and publishes it on GitHub Pages, at https://<user>.github.io/<repo>/, on every
# push to master (or by hand from the Actions tab). Turn it on once in the repo's Settings > Pages:
# Source "GitHub Actions". The asset URLs are relative to the page, so the build only needs the
# repo's name as its base. While the repo is private it does nothing (Pages for a private repo
# needs a paid plan).
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Nothing by default: each job asks for what it needs. Only the deploy, which runs no code from the
# repo or its dependencies, may publish.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Actions pinned to commits (the tags they were on, 2026-10-20), so a moved tag can't change them
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
