<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 28 10 6l6 10 4-6 8 18z%27 fill=%27%23e0905a%27/%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sound Packs</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #14161a; color: #e4e0d8; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; opacity: .7; }
  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 12px 14px; background: #1c1f24; border: 1px solid #2a2e35; border-radius: 8px; margin-bottom: 20px; }
  .controls label { display: flex; gap: 8px; align-items: center; }
  .controls output { min-width: 4.5em; font-variant-numeric: tabular-nums; opacity: .8; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .55; margin: 22px 0 8px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #22252b; flex-wrap: wrap; }
  .name { min-width: 180px; font-family: ui-monospace, monospace; font-size: 13px; }
  .tag { font-size: 11px; opacity: .55; min-width: 70px; }
  button { background: #272b32; color: inherit; border: 1px solid #353a43; border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { background: #31363f; }
  button.on { background: #6b4a1e; border-color: #8a6230; }
  select { background: #272b32; color: inherit; border: 1px solid #353a43; border-radius: 6px; padding: 4px 8px; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Sound packs</h1>
  <p class="lead">Every sound that ships with Breakable.js and its worlds, played by the library's engine (a world's pack at that world's levels). Set how far off it is to hear the air take the treble, the delay, and the street's reverb.</p>
  <div class="controls">
    <label>Pack <select id="pack"></select></label>
    <label>Distance <input id="distance" type="range" min="0" max="200" value="6" /> <output id="distanceOut">6 m</output></label>
    <label>Direction <input id="angle" type="range" min="-180" max="180" value="30" /> <output id="angleOut">30°</output></label>
    <button id="stop">Stop all</button>
  </div>
  <div id="list">Loading…</div>
</main>
<script type="module" src="/src/demo/sound-browser.ts"></script>
</body>
</html>
